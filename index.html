<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub File Uploader</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    padding: 32px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #24292e;
  }
  .subtitle {
    color: #586069;
    font-size: 14px;
    margin-bottom: 24px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #24292e;
    margin-bottom: 6px;
    margin-top: 16px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d1d5da;
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.2s;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    outline: none;
    border-color: #0366d6;
    box-shadow: 0 0 0 3px rgba(3,102,214,0.1);
  }
  .drop-zone {
    margin-top: 20px;
    border: 2px dashed #d1d5da;
    border-radius: 10px;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fafbfc;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #0366d6;
    background: #f1f8ff;
  }
  .drop-zone p {
    color: #586069;
    font-size: 14px;
  }
  .drop-zone strong { color: #0366d6; }
  input[type="file"] { display: none; }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #2ea44f;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover:not(:disabled) { background: #2c974b; }
  button:disabled {
    background: #94d3a2;
    cursor: not-allowed;
  }
  .file-list {
    margin-top: 16px;
    max-height: 200px;
    overflow-y: auto;
  }
  .file-item {
    display: flex;
    justify-content: space-between;
    padding: 8px 12px;
    background: #f6f8fa;
    border-radius: 6px;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .file-item .size { color: #586069; }
  .log {
    margin-top: 20px;
    max-height: 200px;
    overflow-y: auto;
    background: #0d1117;
    color: #c9d1d9;
    border-radius: 8px;
    padding: 12px;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 12px;
    display: none;
  }
  .log.show { display: block; }
  .log .success { color: #3fb950; }
  .log .error { color: #f85149; }
  .log .info { color: #58a6ff; }
  .hint {
    font-size: 12px;
    color: #586069;
    margin-top: 6px;
  }
  .hint a { color: #0366d6; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <h1>📤 GitHub File Uploader</h1>
  <p class="subtitle">Upload any file type directly to your GitHub repository</p>

  <label for="token">Personal Access Token</label>
  <input type="password" id="token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
  <p class="hint">
    Create one at
    <a href="https://github.com/settings/tokens/new?scopes=repo" target="_blank">
      github.com/settings/tokens
    </a>
    with <strong>repo</strong> scope
  </p>

  <label for="owner">Username / Owner</label>
  <input type="text" id="owner" placeholder="e.g. octocat">

  <label for="repo">Repository Name</label>
  <input type="text" id="repo" placeholder="e.g. my-repo">

  <label for="branch">Branch</label>
  <input type="text" id="branch" value="main" placeholder="main">

  <label for="path">Target Folder (optional)</label>
  <input type="text" id="path" placeholder="e.g. uploads/images">

  <div class="drop-zone" id="dropZone">
    <p><strong>Click to select</strong> or drag & drop files here</p>
    <p class="hint">All file types supported • Multiple files allowed</p>
  </div>
  <input type="file" id="fileInput" multiple>

  <div class="file-list" id="fileList"></div>

  <button id="uploadBtn" disabled>Upload to GitHub</button>

  <div class="log" id="log"></div>
</div>

<script>
  const TOKEN_KEY = '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';
  const tokenInput = document.getElementById('token');
  const ownerInput = document.getElementById('owner');
  const repoInput  = document.getElementById('repo');
  const branchInput= document.getElementById('branch');
  const pathInput  = document.getElementById('path');
  const dropZone   = document.getElementById('dropZone');
  const fileInput  = document.getElementById('fileInput');
  const fileList   = document.getElementById('fileList');
  const uploadBtn  = document.getElementById('uploadBtn');
  const logBox     = document.getElementById('log');

  let selectedFiles = [];

  // Restore saved inputs
  tokenInput.value  = localStorage.getItem(TOKEN_KEY) || '';
  ownerInput.value  = localStorage.getItem('gh_owner') || '';
  repoInput.value   = localStorage.getItem('gh_repo') || '';
  branchInput.value = localStorage.getItem('gh_branch') || 'main';
  pathInput.value   = localStorage.getItem('gh_path') || '';

  [['gh_owner', ownerInput], ['gh_repo', repoInput],
   ['gh_branch', branchInput], ['gh_path', pathInput]].forEach(([key, el]) => {
    el.addEventListener('input', () => localStorage.setItem(key, el.value));
  });
  tokenInput.addEventListener('input', () => localStorage.setItem(TOKEN_KEY, tokenInput.value));

  // Drag & drop
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    addFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', e => addFiles(e.target.files));

  function addFiles(files) {
    for (const f of files) {
      if (!selectedFiles.some(s => s.name === f.name && s.size === f.size)) {
        selectedFiles.push(f);
      }
    }
    renderFiles();
  }

  function renderFiles() {
    fileList.innerHTML = '';
    selectedFiles.forEach((f, i) => {
      const div = document.createElement('div');
      div.className = 'file-item';
      div.innerHTML = `<span>${escapeHtml(f.name)}</span>
        <span class="size">${formatSize(f.size)}
          <button style="background:none;border:none;color:#f85149;cursor:pointer;margin-left:8px;width:auto;padding:0;font-weight:bold;" data-i="${i}">✕</button>
        </span>`;
      fileList.appendChild(div);
    });
    fileList.querySelectorAll('button').forEach(b => {
      b.addEventListener('click', e => {
        selectedFiles.splice(+e.target.dataset.i, 1);
        renderFiles();
      });
    });
    uploadBtn.disabled = selectedFiles.length === 0;
    uploadBtn.textContent = selectedFiles.length
      ? `Upload ${selectedFiles.length} file(s) to GitHub`
      : 'Upload to GitHub';
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1048576).toFixed(2) + ' MB';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[c]);
  }

  function log(msg, type = 'info') {
    logBox.classList.add('show');
    const line = document.createElement('div');
    line.className = type;
    line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.appendChild(line);
    logBox.scrollTop = logBox.scrollHeight;
  }

  async function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function uploadFile(file, token, owner, repo, branch, basePath) {
    const path = [basePath, file.name].filter(Boolean).join('/');
    const url = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeURIComponent(path).replace(/%2F/g,'/')}`;

    // Check if file already exists (to update rather than fail)
    let sha;
    try {
      const check = await fetch(`${url}?ref=${branch}`, {
        headers: { Authorization: `token ${token}` }
      });
      if (check.ok) {
        const data = await check.json();
        sha = data.sha;
      }
    } catch (_) {}

    const content = await fileToBase64(file);
    const body = {
      message: sha ? `Update ${file.name}` : `Upload ${file.name}`,
      content,
      branch
    };
    if (sha) body.sha = sha;

    const res = await fetch(url, {
      method: 'PUT',
      headers: {
        Authorization: `token ${token}`,
        'Content-Type': 'application/json',
        Accept: 'application/vnd.github+json'
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `HTTP ${res.status}`);
    }
    return path;
  }

  uploadBtn.addEventListener('click', async () => {
    const token  = tokenInput.value.trim();
    const owner  = ownerInput.value.trim();
    const repo   = repoInput.value.trim();
    const branch = branchInput.value.trim() || 'main';
    const path   = pathInput.value.trim().replace(/^\/+|\/+$/g, '');

    if (!token || !owner || !repo) {
      log('❌ Token, owner, and repo are required.', 'error');
      return;
    }
    if (selectedFiles.length === 0) return;

    uploadBtn.disabled = true;
    uploadBtn.textContent = 'Uploading...';
    logBox.innerHTML = '';
    log(`Starting upload of ${selectedFiles.length} file(s)...`, 'info');

    let ok = 0, fail = 0;
    for (const file of selectedFiles) {
      try {
        const p = await uploadFile(file, token, owner, repo, branch, path);
        log(`✅ ${p}`, 'success');
        ok++;
      } catch (err) {
        log(`❌ ${file.name}: ${err.message}`, 'error');
        fail++;
      }
    }

    log(`Done. ${ok} succeeded, ${fail} failed.`, ok ? 'success' : 'error');
    uploadBtn.disabled = false;
    renderFiles();
  });
</script>
</body>
</html>
